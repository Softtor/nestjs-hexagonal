# Example project rulebook. Copy it to <project>/.claude/rulebook.yaml,
# refresh the sha256 stamps (sha256sum rulebooks/<id>.rulebook.yaml in the
# installed plugin) and add the project's own rules under its namespace.
# A stale stamp does not stop the check: findings are reported as
# uncalibrated and never block.
$schema: nestjs-hexagonal/rulebook@1
id: acme-crm
version: 0.1.0
extends:
  - id: hexagonal
    version: 1.3.0
    sha256: 90cac4dd42ef2870b40133e092f4bdd403315019863c6c34c6f7feca532e3182
  - id: softtor-conventions
    version: 1.2.0
    sha256: 85df420053645555e421fe34e5363e97cec17f70f793f93ffc9bcff8e419271c
model:
  provider: typesafe
  pin: jev-1.13.0

rules:
  - id: acme/no-console-in-handlers
    title: Handlers do not log to the console
    layer: application
    scope:
      include: ['src/**/application/**/*.handler.ts']
    class: static
    severity: WARN
    rationale: Handlers log through the injected logger port so tests can assert on it.
    fix: Inject the LoggerPort and remove the console call.
    source: acme conventions
    check:
      kind: regex
      pattern: 'console\.(?:log|warn|error)\s*\('
    tags: [logging]

overrides:
  - id: softtor/identifiers-english
    severity: WARN
    scope:
      exclude: ['src/legacy/**']
  # Tenant isolation enforced by Postgres RLS (issue #15): a method that queries
  # by an aggregate id already bound to the tenant, or a findUnique by id on an
  # RLS-protected model, is not a leak. The regex replaces the base one and is
  # tested against the whole enclosing method; methods with no scope still fail.
  - id: softtor/tenant-scoped-query
    check:
      unlessInEnclosingDeclaration: '\b(?:organizationId|conversationId|subscriptionId)\b|\bprisma\.(?:conversation|message)\.findUnique\s*\(\s*\{\s*where:\s*\{\s*id\s*\}'
